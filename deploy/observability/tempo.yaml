server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 30s
  max_block_bytes: 1_000_000
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 72h
    compacted_block_retention: 1h
    retention_delay: 30m

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/traces
    pool:
      max_workers: 100
      queue_depth: 10000

overrides:
  defaults:
    max_spans_per_trace: 10000

limits:
  max_search_bytes_per_trace: 1048576
  max_spans_per_trace: 10000
  max_bytes_per_span: 512000

memberlist:
  join_members:
    - tempo