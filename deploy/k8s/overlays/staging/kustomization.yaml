apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devplatform-staging

resources:
  - ../../base

labels:
  - includeSelectors: true
    pairs:
      environment: staging

patches:
  - target:
      kind: Deployment
      name: control-plane
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

images:
  - name: ghcr.io/atlur/devplatform/control-plane
    newTag: latest
  - name: ghcr.io/atlur/devplatform/worker
    newTag: latest
  - name: ghcr.io/atlur/devplatform/frontend
    newTag: latest

replicas:
  - name: control-plane
    count: 1
  - name: worker
    count: 1
  - name: frontend
    count: 1

commonAnnotations:
  environment: staging