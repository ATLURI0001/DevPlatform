apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devplatform

resources:
  - ../../base

labels:
  - includeSelectors: true
    pairs:
      environment: production

patches:
  - target:
      kind: Deployment
      name: control-plane
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

images:
  - name: ghcr.io/atlur/devplatform/control-plane
    newTag: "{{IMAGE_TAG}}"
  - name: ghcr.io/atlur/devplatform/worker
    newTag: "{{IMAGE_TAG}}"
  - name: ghcr.io/atlur/devplatform/frontend
    newTag: "{{IMAGE_TAG}}"

replicas:
  - name: control-plane
    count: 3
  - name: worker
    count: 5
  - name: frontend
    count: 3

commonAnnotations:
  environment: production