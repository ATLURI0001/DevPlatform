apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: devplatform
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: 'devplatform'
              static_configs:
                - targets: ['localhost:9090']

    processors:
      batch:
        timeout: 10s
        send_batch_size: 1000
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
      resource:
        attributes:
          - key: service.name
            value: "devplatform"
            action: upsert
          - key: deployment.environment
            value: "production"
            action: upsert

    exporters:
      otlp:
        endpoint: "tempo:4317"
        tls:
          insecure: true
      otlphttp:
        endpoint: "http://loki:3100/loki/api/v1/push"
      prometheus:
        endpoint: "0.0.0.0:8888"

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch, memory_limiter, resource]
          exporters: [otlp]
        metrics:
          receivers: [otlp, prometheus]
          processors: [batch, memory_limiter, resource]
          exporters: [prometheus, otlp]
        logs:
          receivers: [otlp]
          processors: [batch, memory_limiter, resource]
          exporters: [otlphttp]