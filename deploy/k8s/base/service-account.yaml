apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplatform
  namespace: devplatform
  labels:
    app.kubernetes.io/name: devplatform
    app.kubernetes.io/part-of: devplatform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devplatform
  namespace: devplatform
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devplatform
  namespace: devplatform
subjects:
  - kind: ServiceAccount
    name: devplatform
    namespace: devplatform
roleRef:
  kind: Role
  name: devplatform
  apiGroup: rbac.authorization.k8s.io