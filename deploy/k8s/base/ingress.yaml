apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devplatform
  namespace: devplatform
  labels:
    app.kubernetes.io/name: devplatform
    app.kubernetes.io/part-of: devplatform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.devplatform.example.com
        - devplatform.example.com
      secretName: devplatform-tls
  rules:
    - host: api.devplatform.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: control-plane
                port:
                  number: 80
    - host: devplatform.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80