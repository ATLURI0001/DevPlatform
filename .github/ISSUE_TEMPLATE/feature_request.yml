name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe your idea.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? What's the use case?
      placeholder: Users currently cannot...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
      placeholder: Add a new endpoint that...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider?
      placeholder: We considered X but rejected because...

  - type: textarea
    id: api
    attributes:
      label: API Design (if applicable)
      description: Sketch the API changes
      render: yaml
      placeholder: |
        POST /api/v1/resource
        Request: { "field": "value" }
        Response: 201 { "id": "..." }

  - type: textarea
    id: migration
    attributes:
      label: Migration Strategy
      description: How will existing users migrate? Breaking changes?
      placeholder: This is a backward-compatible addition...

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: This aligns with the project's goals and scope
          required: true
        - label: I'm willing to help implement this
          required: false